name: 💡 국민연금 포트폴리오 자동 갱신 & Pages 배포

on:
  # 매일 한국 시간 04:00 = UTC 19:00 (전일)
  schedule:
    - cron: '0 19 * * *'

  # 수동 실행 버튼
  workflow_dispatch:

  # main 브랜치 push 시 Pages 배포도 같이
  push:
    branches:
      - main

# GitHub Pages 배포에 필요한 권한
permissions:
  contents: write        # 파일 커밋/푸시
  pages: write           # Pages 배포
  id-token: write        # OIDC 인증 (Pages)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────
  # Job 1: 데이터 수집 (schedule / workflow_dispatch 트리거 시)
  # ─────────────────────────────────────────
  fetch-data:
    name: 📥 NPS 데이터 수집
    runs-on: ubuntu-latest
    # push 이벤트는 데이터 수집 건너뜀 (이미 커밋된 상태)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      changed: ${{ steps.check.outputs.changed }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 국민연금 데이터 수집 실행
        run: python scripts/fetch_nps.py

      - name: 변경 여부 확인
        id: check
        run: |
          if git diff --quiet public/data/nps.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nps.json 변경 없음 — 커밋 건너뜀"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "nps.json 변경 감지"
          fi

      - name: 변경 사항 커밋 & 푸시
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/nps.json
          git commit -m "💡 자동 업데이트: 국민연금 포트폴리오 데이터"
          git push

  # ─────────────────────────────────────────
  # Job 2: React 빌드 & GitHub Pages 배포
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 빌드 & Pages 배포
    runs-on: ubuntu-latest
    # 데이터 수집 job이 있을 때는 완료 후 실행, push 이벤트는 바로 실행
    needs: [fetch-data]
    if: |
      always() && (
        github.event_name == 'push' ||
        needs.fetch-data.result == 'success' ||
        needs.fetch-data.result == 'skipped'
      )

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 저장소 체크아웃 (최신 커밋 포함)
        uses: actions/checkout@v4
        with:
          ref: main        # 데이터 수집 후 push된 최신 커밋 사용

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Vite 빌드
        run: npm run build
        env:
          NODE_ENV: production

      - name: GitHub Pages 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
