name: 💡 시장 데이터 자동 갱신 & Pages 배포

on:
  schedule:
    - cron: '0 19 * * *'   # 매일 KST 04:00 (UTC 19:00)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────
  # Job 1: 데이터 수집
  # ─────────────────────────────────────────────────
  fetch-data:
    name: 📥 시장 데이터 수집
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      changed: ${{ steps.check.outputs.changed }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      # ① 국민연금 포트폴리오 (DART OpenAPI)
      - name: NPS 수집 (DART OpenAPI)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/fetch_nps.py

      # ② VIX · 미 국채금리 · 달러인덱스 · S&P500 (yfinance)
      - name: 시장 핵심지표 수집 (VIX·금리·DXY)
        run: python scripts/fetch_market_data.py

      # ③ 신고가·신저가 비율 (yfinance KOSPI 80종목)
      - name: 신고가 비율 수집 (KOSPI 주요주)
        run: python scripts/fetch_breadth.py

      - name: 변경 여부 확인
        id: check
        run: |
          if git diff --quiet public/data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 없음"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "변경 감지:"
            git diff --name-only public/data/
          fi

      - name: 커밋 & 푸시
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git commit -m "💡 자동 업데이트: NPS·VIX·금리·DXY·신고가비율"
          git push

  # ─────────────────────────────────────────────────
  # Job 2: 빌드 & GitHub Pages 배포
  # ─────────────────────────────────────────────────
  deploy:
    name: 🚀 빌드 & Pages 배포
    runs-on: ubuntu-latest
    needs: [fetch-data]
    if: |
      always() && (
        github.event_name == 'push' ||
        needs.fetch-data.result == 'success' ||
        needs.fetch-data.result == 'skipped'
      )
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Vite 빌드
        run: npm run build
        env:
          NODE_ENV: production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
